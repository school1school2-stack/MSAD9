        :root { --primary: #0284c7; --secondary: #0369a1; --bg: #f8fafc; --accent: #f59e0b; --correct: #16a34a; --wrong: #dc2626; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; user-select: none; }

        .correct-flash { background-color: #dcfce7 !important; border-color: var(--correct) !important; color: var(--correct); border-width: 3px !important; box-shadow: 0 0 10px rgba(22,163,74,0.2); }

        .hidden { display: none !important; }
        input[type="email"], input[type="text"] { width: 85%; padding: 15px; margin-bottom: 25px; border-radius: 10px; border: 2px solid #ddd; font-size: 1.1rem; text-align: center; outline: none; }
        .btn-start { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 15px 40px; border: none; border-radius: 12px; cursor: pointer; font-size: 1.2rem; font-weight: bold; transition: transform 0.2s; }
        .btn-start:hover { transform: scale(1.05); }
        #feedback { margin-top: 20px; font-weight: bold; font-size: 1.2rem; min-height: 1.6em; }
        #timer-text { font-weight: bold; color: var(--wrong); margin-bottom: 15px; font-size: 1.1rem; }
        .copyright { font-size: 0.9rem; color: #64748b; margin-top: 30px; border-top: 1px solid #eee; padding-top: 15px; }
        .normal-text { color: #334155; font-weight: normal; }
        .date-badge { background: #f1f5f9; color: var(--wrong); padding: 5px 15px; border-radius: 20px; font-size: 0.9rem; font-weight: bold; margin-bottom: 15px; display: inline-block; }
        
        .review-container { text-align: right; margin-top: 20px; max-height: 380px; overflow-y: auto; padding: 10px; border: 1px solid #eee; border-radius: 10px; background: #fafafa; }

        .review-item.wrong-ans { border-right-color: var(--wrong); }
        .review-q { font-weight: bold; font-size: 1.05rem; color: #1e293b; margin-bottom: 5px; }

];

    let quizData = [];
    function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

    async function verifyAndStart() {
        const emailInput = document.getElementById('studentEmail').value.trim().toLowerCase();
        if(!emailInput.includes('@')) { alert("يرجى إدخال إيميل منصة مدرستي صحيحاً"); return; }
        
        const loginSection = document.getElementById('login-section');
        let statusMsg = document.getElementById('status-msg');
        if (!statusMsg) {
            statusMsg = document.createElement('p');
            statusMsg.id = 'status-msg';
            statusMsg.style.cssText = "color:var(--primary); font-weight:bold; margin-top:15px;";
            loginSection.appendChild(statusMsg);
        }
        statusMsg.innerText = "جاري التحقق من السجل... ⏳";

        try {
            const allowedDoc = await db.collection("allowed_students").doc(emailInput).get();
            if (!allowedDoc.exists) {
                showLock("هذا الإيميل غير مسجل في قوائم الفصل. يرجى مراجعة المعلم.");
                return;
            }

            sName = allowedDoc.data().name;
            sEmail = emailInput;

            const resultCheck = await db.collection("alkfaeat_results")
                .where("email", "==", sEmail)
                .where("model_id", "==", currentModelId).get();

            if (!resultCheck.empty) {
                showLock(`عذراً يا ${sName}، لقد أديت هذا التحدي مسبقاً.`);
                return;
            }

            quizData = shuffle([...rawQuizData]);
            studentAnswersLog = [];
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');
            showQuestion();
        } catch (e) { 
            alert("حدث خطأ في الاتصال بقاعدة البيانات. تأكد من اتصال الإنترنت.");
            statusMsg.innerText = "";
        }
    }

    function showLock(msg) {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('lock-screen').classList.remove('hidden');
        document.getElementById('lock-message').innerText = msg;
    }

    function showQuestion() {
        if(currentQ >= quizData.length) { finishQuiz(); return; }
        const q = quizData[currentQ];
        document.getElementById('question-title').innerText = `س ${currentQ + 1} من ${quizData.length} | ${q.t}`;
        document.getElementById('question-text').innerText = q.q;
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        document.getElementById('feedback').innerText = '';
        
        shuffle([...q.opts]).forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt === q.ans, q.ans, q.q);
            container.appendChild(btn);
        });
        startTimer();
    }

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 40;
        updateTimerUI();
        timerInterval = setInterval(() => { 
            timeLeft--; 
            updateTimerUI(); 
            if (timeLeft <= 0) { 
                clearInterval(timerInterval); 
                handleTimeout(); 
            } 
        }, 1000);
    }

    function updateTimerUI() {
        document.getElementById('timer-text').innerText = `⏳ المتبقي: ${timeLeft} ثانية`;
        document.getElementById('timer-bar').style.width = `${(timeLeft / 40) * 100}%`;
    }

    function checkAnswer(btn, isCorrect, correctText, qText) {
        clearInterval(timerInterval);
        disableButtons();
        
        if (isCorrect) {
            score++;
            btn.classList.add('correct-flash');
            document.getElementById('feedback').innerHTML = "<span style='color:var(--correct)'>رائع! إجابة دقيقة يا بطل 🌟</span>";
            confetti({ particleCount: 120, spread: 60, origin: { y: 0.6 } });
        } else {
            btn.classList.add('wrong-flash');
            highlightCorrect(correctText);
            document.getElementById('feedback').innerHTML = "<span style='color:var(--wrong)'>محاولة جيدة، الصواب موضح بالأخضر 💪</span>";
        }

        studentAnswersLog.push({
            qText: qText,
            studentAns: btn.innerText,
            correctAns: correctText,
            isCorrect: isCorrect
        });

        setTimeout(nextQuestion, 3500);
    }

    function handleTimeout() {
        disableButtons();
        const q = quizData[currentQ];
        highlightCorrect(q.ans);
        document.getElementById('feedback').innerHTML = "<span style='color:var(--accent)'>انتهى الوقت! ركز في السؤال القادم 🕒</span>";
        
        studentAnswersLog.push({
            qText: q.q,
            studentAns: "انتهى الوقت (بدون إجابة)",
            correctAns: q.ans,
            isCorrect: false
        });

        setTimeout(nextQuestion, 3500);
    }

    function highlightCorrect(text) {
        document.querySelectorAll('.option-btn').forEach(b => { if (b.innerText === text) b.classList.add('correct-flash'); });
    }

    function disableButtons() { document.querySelectorAll('.option-btn').forEach(b => b.disabled = true); }

    function nextQuestion() {
        currentQ++;
        showQuestion();
    }

    async function finishQuiz() {
        document.getElementById('quiz-section').classList.add('hidden');
        document.getElementById('result-section').classList.remove('hidden');
        
        document.getElementById('final-greeting').innerText = `البطل: ${sName} 💐`;
        document.getElementById('final-score').innerText = `${score} / ${quizData.length}`;
        
        const reviewListContainer = document.getElementById('review-list');
        reviewListContainer.innerHTML = '';

        studentAnswersLog.forEach((item, index) => {
            const reviewItem = document.createElement('div');
            reviewItem.className = `review-item ${item.isCorrect ? 'correct-ans' : 'wrong-ans'}`;
            
            let feedbackText = item.isCorrect 
                ? "✅ أحسنت! إجابتك صحيحة وموفقة." 
                : `❌ إجابتك غير صحيحة. الصواب هو: (${item.correctAns})`;

            reviewItem.innerHTML = `
                <div class="review-q">س ${index + 1}: ${item.qText}</div>
                <div class="review-details">
                    <div>إجابتك: <strong>${item.studentAns}</strong></div>
                    <div style="margin-top: 4px; color: ${item.isCorrect ? '#16a34a' : '#dc2626'};">${feedbackText}</div>
                </div>
            `;
            reviewListContainer.appendChild(reviewItem);
        });

        try {
            // حفظ النتيجة في سحابة الأستاذ مساعد (alkfaeat_results)
            await db.collection("alkfaeat_results").add({ 
                name: sName, 
                email: sEmail, 
                score: score, 
                total: quizData.length, 
                model_id: currentModelId, 
                answers: studentAnswersLog,
                time: firebase.firestore.FieldValue.serverTimestamp() 
            });
        } catch (e) {
            console.log("تعذر حفظ النتيجة سحابياً.");
        }
    }
</script>
</body>
</html>
